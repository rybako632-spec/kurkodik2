<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KURKODIK — MENU</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#150d09;
    color:#e1d9d1;
    font-family:"Open Sans",sans-serif;
}

.menu-card{
    max-width:680px;
    margin:0 auto;
    min-height:100vh;
    background:#20120b;
    border-left:1px solid #331d12;
    border-right:1px solid #331d12;
    box-shadow:0 0 30px rgba(0,0,0,.5);
    position:relative;
    overflow:hidden;
}

/* BACK */

.back-btn{
    position:absolute;
    top:18px;
    left:18px;
    width:44px;
    height:44px;
    border-radius:50%;
    border:none;
    background:#e87932;
    color:#150d09;
    font-size:23px;
    font-weight:bold;
    cursor:pointer;
    z-index:10;
}

.back-btn:hover{
    transform:scale(1.05);
}

/* HERO */

.hero{
    position:relative;
    height:250px;
    overflow:hidden;
}

.hero img{
    width:100%;
    height:100%;
    object-fit:cover;
    filter:brightness(.65);
    transition:opacity .25s ease;
}

.hero-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to top,
        #20120b 0%,
        rgba(32,18,11,.45) 45%,
        rgba(0,0,0,.1) 100%
    );
}

.hero-title{
    position:absolute;
    bottom:18px;
    left:25px;
    color:#e87932;
    font-family:"Bebas Neue",sans-serif;
    font-size:54px;
    letter-spacing:2px;
    z-index:2;
}

.hero-label{
    position:absolute;
    right:18px;
    bottom:22px;
    writing-mode:vertical-rl;
    transform:rotate(180deg);
    font-size:11px;
    letter-spacing:3px;
    color:#b59d8c;
    z-index:2;
}

/* CATEGORIES */

.categories{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding:15px 20px 17px;
    scrollbar-width:none;
    border-bottom:1px solid #331d12;
}

.categories::-webkit-scrollbar{
    display:none;
}

.cat{
    flex-shrink:0;
    border:none;
    background:none;
    color:#80695a;
    font-family:"Bebas Neue",sans-serif;
    font-size:19px;
    letter-spacing:1px;
    cursor:pointer;
    transition:.2s;
}

.cat:hover{
    color:#c77a46;
}

.cat.active{
    color:#e87932;
    transform:scale(1.08);
}

/* DISHES */

.dishes{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
    padding:20px;
    transition:opacity .2s ease;
}

.dish{
    background:#28150c;
    border:1px solid #3a2014;
    border-radius:8px;
    padding:14px;
    cursor:pointer;
    transition:.2s;
    min-height:125px;
}

.dish:hover{
    transform:translateY(-2px);
    border-color:#e87932;
}

.dish-name{
    color:#e87932;
    font-family:"Bebas Neue",sans-serif;
    font-size:22px;
    letter-spacing:.7px;
    margin-bottom:6px;
}

.dish-price{
    color:#fff;
    font-size:16px;
    font-weight:700;
    margin-bottom:7px;
}

.dish-description{
    color:#9f8d80;
    font-size:12px;
    line-height:1.45;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:40px 10px;
    color:#80695a;
    font-size:14px;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    z-index:100;
    padding:20px;
    align-items:center;
    justify-content:center;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow-y:auto;
    background:#20120b;
    border:1px solid #e87932;
    border-radius:10px;
    position:relative;
    box-shadow:0 10px 40px rgba(0,0,0,.7);
}

.modal-image{
    width:100%;
    height:250px;
    object-fit:cover;
}

.modal-content{
    padding:20px;
}

.modal-title{
    color:#e87932;
    font-family:"Bebas Neue",sans-serif;
    font-size:34px;
    letter-spacing:1px;
    margin-bottom:6px;
}

.modal-price{
    color:#fff;
    font-weight:bold;
    font-size:18px;
    margin-bottom:15px;
}

.modal-description{
    color:#c5b7ac;
    font-size:14px;
    line-height:1.5;
    margin-bottom:15px;
}

.modal-info{
    margin-top:10px;
}

.modal-info strong{
    color:#e87932;
    display:block;
    margin-bottom:4px;
}

.modal-info p{
    color:#b9a89b;
    font-size:13px;
    line-height:1.5;
}

.close-modal{
    position:absolute;
    right:12px;
    top:12px;
    width:38px;
    height:38px;
    border:none;
    border-radius:50%;
    background:#e87932;
    color:#150d09;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    z-index:5;
}

/* MOBILE */

@media(max-width:520px){

    .dishes{
        grid-template-columns:1fr;
    }

    .hero{
        height:230px;
    }

    .hero-title{
        font-size:46px;
    }

    .modal{
        padding:10px;
    }

    .modal-image{
        height:210px;
    }
}
</style>
</head>

<body>

<div class="menu-card">

    <button class="back-btn" onclick="goBack()">‹</button>

    <!-- HERO -->

    <div class="hero">

        <img
            id="heroImage"
            src="https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=1600&q=80"
            alt="Menu"
        >

        <div class="hero-overlay"></div>

        <div
            class="hero-title"
            id="heroTitle"
        >
            STEKI
        </div>

        <div class="hero-label">
            KURKODIK MENU
        </div>

    </div>


    <!-- CATEGORIES -->

    <div class="categories">

        <button
            class="cat active"
            data-category="steki"
        >
            STEKI
        </button>

        <button
            class="cat"
            data-category="dania"
        >
            DANIA
        </button>

        <button
            class="cat"
            data-category="desery"
        >
            DESERY
        </button>

        <button
            class="cat"
            data-category="salatki"
        >
            SAŁATKI
        </button>

    </div>


    <!-- DISHES -->

    <div
        class="dishes"
        id="dishes"
    ></div>

</div>


<!-- MODAL -->

<div
    class="modal"
    id="modal"
>

    <div class="modal-box">

        <button
            class="close-modal"
            onclick="closeModal()"
        >
            ×
        </button>

        <img
            id="modalImage"
            class="modal-image"
            src=""
            alt=""
        >

        <div class="modal-content">

            <div
                class="modal-title"
                id="modalTitle"
            ></div>

            <div
                class="modal-price"
                id="modalPrice"
            ></div>

            <div
                class="modal-description"
                id="modalDescription"
            ></div>

            <div class="modal-info">

                <strong>Składniki</strong>

                <p id="modalIngredients">
                    —
                </p>

            </div>

            <div class="modal-info">

                <strong>Alergeny</strong>

                <p id="modalAllergens">
                    —
                </p>

            </div>

        </div>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {

    apiKey:
        "AIzaSyDFP5FWKwuMifp67LhRMbABVwv16NmHrf8",

    authDomain:
        "kurkodik2.firebaseapp.com",

    projectId:
        "kurkodik2",

    storageBucket:
        "kurkodik2.firebasestorage.app",

    messagingSenderId:
        "68141393475",

    appId:
        "1:68141393475:web:6eeb35e6059f6aebda16f6",

    measurementId:
        "G-Q2Q83TKEV9"

};

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


/* CATEGORY HEROES */

const categoryHeroes = {

    steki:{
        title:"STEKI",
        img:
        "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=1600&q=80"
    },

    dania:{
        title:"DANIA",
        img:
        "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1600&q=80"
    },

    desery:{
        title:"DESERY",
        img:
        "https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&w=1600&q=80"
    },

    salatki:{
        title:"SAŁATKI",
        img:
        "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=1600&q=80"
    }

};


/* ELEMENTS */

const dishesContainer =
    document.getElementById("dishes");

const hero =
    document.getElementById("heroImage");

const heroTitle =
    document.getElementById("heroTitle");


let allDishes = [];

let currentCategory =
    "steki";


/* FIRESTORE */

onSnapshot(

    collection(db,"dishes"),

    snapshot => {

        allDishes = [];

        snapshot.forEach(doc => {

            const data =
                doc.data();

            if(data.type === "menu"){

                allDishes.push({

                    id:doc.id,

                    ...data

                });

            }

        });

        showCategory(
            currentCategory
        );

    },

    error => {

        console.error(
            "Firebase error:",
            error
        );

        dishesContainer.innerHTML = `

            <div class="empty">

                Nie udało się załadować menu.

            </div>

        `;

    }

);


/* SHOW CATEGORY */

function showCategory(category){

    currentCategory =
        category;


    const catInfo =
        categoryHeroes[category] ||
        categoryHeroes.steki;


    /* CHANGE HERO */

    hero.style.opacity =
        "0";


    setTimeout(() => {

        hero.src =
            catInfo.img;

        heroTitle.textContent =
            catInfo.title;

        hero.style.opacity =
            "1";

    },150);


    /* FILTER */

    const dishes =
        allDishes.filter(

            dish =>

                String(
                    dish.category || ""
                ).toLowerCase() ===
                category.toLowerCase()

        );


    renderDishes(dishes);


    /* ACTIVE BUTTON */

    document
        .querySelectorAll(".cat")
        .forEach(button => {

            button.classList.toggle(

                "active",

                button.dataset.category ===
                category

            );

        });

}


/* RENDER */

function renderDishes(dishes){

    dishesContainer.style.opacity =
        "0";


    setTimeout(() => {

        dishesContainer.innerHTML =
            "";


        if(dishes.length === 0){

            dishesContainer.innerHTML = `

                <div class="empty">

                    Brak pozycji w tej kategorii.

                </div>

            `;

        }else{

            dishes.forEach(dish => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "dish";


                card.innerHTML = `

                    <div class="dish-name">

                        ${escapeHTML(
                            dish.name ||
                            "Bez nazwy"
                        )}

                    </div>


                    <div class="dish-price">

                        ${escapeHTML(
                            dish.price || ""
                        )} zł

                    </div>


                    <div class="dish-description">

                        ${escapeHTML(
                            dish.description || ""
                        )}

                    </div>

                `;


                card.addEventListener(

                    "click",

                    () =>
                        openModal(dish)

                );


                dishesContainer.appendChild(
                    card
                );

            });

        }


        dishesContainer.style.opacity =
            "1";


    },150);

}


/* CATEGORY BUTTONS */

document
    .querySelectorAll(".cat")
    .forEach(button => {

        button.addEventListener(

            "click",

            () => {

                showCategory(
                    button.dataset.category
                );

            }

        );

    });


/* MODAL */

function openModal(dish){

    document
        .getElementById("modalTitle")
        .textContent =
        dish.name ||
        "Bez nazwy";


    document
        .getElementById("modalPrice")
        .textContent =
        `${dish.price || ""} zł`;


    document
        .getElementById("modalDescription")
        .textContent =
        dish.description || "";


    document
        .getElementById("modalIngredients")
        .textContent =
        dish.ingredients || "—";


    document
        .getElementById("modalAllergens")
        .textContent =
        dish.allergens || "—";


    const image =
        document.getElementById(
            "modalImage"
        );


    if(dish.photo){

        image.src =
            dish.photo;

        image.style.display =
            "block";

    }else{

        image.style.display =
            "none";

    }


    document
        .getElementById("modal")
        .classList.add("show");

}


window.closeModal =
function(){

    document
        .getElementById("modal")
        .classList.remove(
            "show"
        );

};


document
    .getElementById("modal")
    .addEventListener(

        "click",

        event => {

            if(
                event.target.id ===
                "modal"
            ){

                closeModal();

            }

        }

    );


/* BACK */

window.goBack =
function(){

    window.location.href =
        "index.html";

};


/* ESCAPE HTML */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>
</html>
